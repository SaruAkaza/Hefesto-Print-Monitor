<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ps-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="ps-figure" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#003566"/>
      <stop offset="100%" stop-color="#001d3d"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado do Favicon -->
  <rect width="100" height="100" rx="22" fill="url(#ps-bg)"/>
  <rect width="96" height="96" x="2" y="2" rx="20" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Cabeça da figura humana Prevent Senior -->
  <circle cx="50.5" cy="20" r="7.5" fill="url(#ps-figure)"/>
  
  <!-- Corpo estilizado em V da Prevent Senior -->
  <path d="M33 11 C34 32, 38 60, 46 95 C49 66, 68 36, 88 15 C75 35, 59 58, 45.8 54 C39 38, 35 24, 33 11 Z" fill="url(#ps-figure)"/>
